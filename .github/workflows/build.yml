name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk yt-dim-overlay.apk
      - uses: actions/upload-artifact@v4
        with:
          name: yt-dim-overlay-apk
          path: yt-dim-overlay.apk
      # Keep a rolling "latest" release so the APK is one tap away on the phone.
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest yt-dim-overlay.apk \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
